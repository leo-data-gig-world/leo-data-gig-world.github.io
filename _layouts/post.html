---
layout: default
---
<main class="wrap post">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">← Blog</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta">{% if page.show_date %}{{ page.date | date: "%-d %B %Y" }} · {% endif %}{{ page.tags | join: " · " }}</p>
  <article class="prose">{{ content }}</article>
</main>
